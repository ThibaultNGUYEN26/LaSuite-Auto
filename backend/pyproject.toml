[project]
name = "auto-backend"
version = "0.1.0"
description = "Backend for the Auto conversational chatbot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pypdf>=6.0",
    "python-dotenv>=1.2.3",
    "httpx>=0.27",
    "truststore>=0.10",
    "sqlalchemy>=2.0",
]

[tool.uv]
package = false
